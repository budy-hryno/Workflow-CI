name: Machine Learning System CI

# memberi opsi push dan pull request pada branch main dan master
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  CSV_URL: "MLproject/loan_default_preprocessing.csv"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Ambil kode repository ke dalam environment GitHub Actions
      - uses: actions/checkout@v3

      # Setup Python 3.12.7
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.12.7"

      # Cek Env Variables
      - name: Check Env
        run: |
          echo $CSV_URL

      # Install mlflow
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install mlflow

      - name: Set MLflow Tracking URI
        run: echo "MLFLOW_TRACKING_URI=sqlite:///Workflow-CI/MLproject/mlflow.db" >> $GITHUB_ENV

      - name: Install Python dependencies
        run: |
          pip install pandas scikit-learn joblib

      # Run sebagai proyek mlflow
      - name: Run mlflow project
        run: |
          cd Workflow-CI/MLproject
          mlflow run . --env-manager=local

      - name: Get latest MLflow run_id
        run: |
          RUN_ID=$(python -c "
          import mlflow
          client = mlflow.tracking.MlflowClient()
          runs = client.search_runs('0', order_by=['start_time DESC'], max_results=1)
          print(runs[0].info.run_id)
          ")
          echo "RUN_ID=$RUN_ID" >> $GITHUB_ENV

      # Upload file artifak ke Github Repository menggunakan Git LFS
      - name: Upload to Git LFS
        run: |
          git config --global user.name ${{ secrets.username }}
          git config --global user.email ${{ secrets.email }}
          git lfs install
          git lfs track "Workflow-CI/MLproject/mlruns/**"
          git add .gitattributes
          git commit -m "Track large files in mlruns with Git LFS" || true
          git push origin master

      # Simpan model ke GitHub Repository
      - name: Save mlruns to repo
        run: |
          git config --global user.name ${{ secrets.username }}
          git config --global user.email ${{ secrets.email }}
          git add -f Workflow-CI/MLproject/mlruns/
          git add -f Workflow-CI/MLproject/mlflow.db
          git commit -m "Save mlruns and mlflow.db from CI run" || true
          git push origin master

      # Build Docker image dari model MLflow dengan mencari path MLmodel secara otomatis,
      # kemudian membungkus model tersebut menjadi Docker image bernama "loan-default-model"
      - name: Build Docker Model
        run: |
          MODEL_PATH=$(find Workflow-CI/MLproject/mlruns -name "MLmodel" | head -1 | xargs dirname)
          mlflow models build-docker -m "$MODEL_PATH" -n "loan-default-model"

      # Login ke Docker Hub dengan menggunakan username dan password akun Docker yang disimpan di GitHub Secrets agar dapat melakukan push Docker image
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # Memberi tag pada Docker image dengan format username/nama-image:versi
      # supaya Docker tau tujuan push-nya ke repository mana di Docker Hub
      - name: Tag Docker Image
        run: |
          docker tag loan-default-model ${{ secrets.DOCKER_USERNAME }}/loan-default-model:latest

      # Push Docker Image berdasarkan username
      - name: Push Docker Image
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/loan-default-model:latest
